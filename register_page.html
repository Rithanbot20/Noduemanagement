<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSMIET · Register</title>
  <!-- Bootstrap 5 + Icons + custom HiFi touch -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background:  #2b436d; }
    .hifi-primary { color: #0b2b4a; }
    .hifi-accent { color: #f5a623; }
    .btn-hifi { background: #f5a623; border: none; color: #0b2b4a; font-weight: 600; }
    .btn-hifi:hover { background: #e09515; color: #0b2b4a; }
    .card-hifi { border: none; border-radius: 24px; box-shadow: 0 20px 40px -12px rgba(11,43,74,0.15); transition: 0.25s ease; }
    .card-hifi:hover { transform: translateY(-4px); box-shadow: 0 28px 48px -16px rgba(11,43,74,0.2); }
    .navbar-hifi { background: #0b2b4a; backdrop-filter: blur(4px); }
    .nav-link-hifi { color: rgba(255,255,255,0.8) !important; font-weight: 500; padding: 0.6rem 1.2rem !important; border-radius: 40px; }
    .nav-link-hifi:hover { color: #f5a623 !important; background: rgba(245,166,35,0.08); }
    .nav-link-hifi.active { color: #f5a623 !important; background: rgba(245,166,35,0.12); }
    .form-control-hifi { border-radius: 60px; padding: 0.75rem 1.5rem; border: 1px solid #dce3ed; background: white; }
    .form-control-hifi:focus { border-color: #f5a623; box-shadow: 0 0 0 4px #f5a62330; }
    .page-tag { background: #0b2b4a08; padding: 0.3rem 1.2rem; border-radius: 40px; color: #0b2b4a; font-weight: 500; letter-spacing: 0.3px; }
    .footer-hifi { background: #0b2b4a; border-radius: 48px 48px 0 0; }
    .page-section { padding-top: 2rem; padding-bottom: 2rem; }
  </style>
</head>
<body>
  <!-- ========== NAVBAR ========== -->
  <nav class="navbar navbar-expand-lg navbar-hifi py-3 px-3 px-lg-5">
    <div class="container-fluid">
      <a class="navbar-brand text-white fw-bold fs-4 d-flex align-items-center gap-2" href="home.html">
        <i class="bi bi-mortarboard-fill" style="color: #f5a623;"></i> SSMIET <span style="font-weight: 300; color: #f5a623;">·</span> No Due
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
      </button>
      {% include 'menu_page.html' %}
    </div>
  </nav>

  <!-- ========== REGISTER PAGE ========== -->
  <section id="register" class="page-section px-3 px-lg-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card card-hifi p-4 p-lg-5">
            <div class="text-center mb-4">
              <span class="page-tag"><i class="bi bi-person-plus me-1"></i> Register</span>
              <h2 class="fw-bold hifi-primary mt-2">Create your account</h2>
              <p class="text-secondary">Join SSMIET No Due · manage your clearances</p>
            </div>
            
            <form id="registerForm" method="post">{% csrf_token %}
              <div class="row g-4">
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Full Name</label>
                  <input type="text" id="fullName" class="form-control form-control-hifi" placeholder="e.g. Ananya Sharma" required name="fname">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Roll Number</label>
                  <input type="text" id="rollNumber" class="form-control form-control-hifi" placeholder="SSMIET2026XXX" required name="rno">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Email (institute)</label>
                  <input type="email" id="email" class="form-control form-control-hifi" placeholder="name@ssmiet.edu.in" required name="mail">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Department</label>
                  <select id="department" class="form-select form-control-hifi" required name="dept">
                    <option value="">Select Department</option>
                    <option>Computer Science</option>
                    <option>Electronics</option>
                    <option>Mechanical</option>
                    <option>Civil</option>
                    <option>Electrical</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Year </label>
                  <input type="text" id="email" class="form-control form-control-hifi" placeholder="1" required name="year">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Address</label>
                  <textarea class="form-control form-control-hifi" placeholder="Address" required name="addr"></textarea>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Password</label>
                  <input type="password" id="password" class="form-control form-control-hifi" placeholder="••••••••" required name="psw">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Confirm Password</label>
                  <input type="password" id="confirmPassword" class="form-control form-control-hifi" placeholder="••••••••" required>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="termsReg" required name="">
                    <label class="form-check-label text-secondary" for="termsReg">I agree to the <a href="#" class="hifi-accent text-decoration-none">terms & conditions</a> of SSMIET No Due.</label>
                  </div>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-hifi w-100 py-3 rounded-pill fw-bold"><i class="bi bi-person-plus me-2"></i> Register Now</button>
                </div>
                <div class="col-12 text-center text-secondary">Already have an account? <a href="{% url 'loginpage' %}" class="hifi-accent text-decoration-none fw-bold">Login</a></div>
              </div>
            </form>
            
            <!-- Success Message Only -->
            <div id="successMessage" style="display: none; margin-top: 20px;">
              <div class="alert alert-success" role="alert" style="border-radius: 16px; text-align: center; padding: 15px;">
                <i class="bi bi-check-circle-fill me-2"></i>
                <strong> {% if messages %}
      {% for i in messages %}
          {{i}}
      {% endfor %}
  {% endif %}</strong>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
</section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>


{% include 'footer_page.html' %}
